async function loadBriefing(){
  let stored = null;
  try{
    stored = await window.storage.get('briefing:latest');
  }catch(e){
    stored = null;
  }

  let storedData = null;
  if(stored && stored.value){
    try{ storedData = JSON.parse(stored.value); }catch(e){ storedData = null; }
  }

  // 如果種子日期比storage新（或storage是空的），就寫入新內容
  if(!storedData || SEED_DATA.date >= storedData.date){
    try{
      await window.storage.set('briefing:latest', JSON.stringify(SEED_DATA));
    }catch(e){ /* 寫入失敗就先用種子資料顯示，不阻擋畫面 */ }
    render(SEED_DATA);
    return;
  }

  render(storedData);
}

function render(data){
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  document.getElementById('dateLine').textContent = data.date || '';
  document.getElementById('updatedBadge').textContent = '更新於 ' + (data.updated_at || '');

  const noteEl = document.getElementById('dataNote');
  if(data.data_note){
    noteEl.textContent = data.data_note;
    noteEl.style.display = 'block';
  }else{
    noteEl.style.display = 'none';
  }

  fillGauge(data.gauge || {});
  fillHoldingsWall(data.holdings || []);
  fillChainList(data.chains || []);
}

function gaugeZoneColor(level){
  if(level < 20) return getComputedStyle(document.documentElement).getPropertyValue('--green');
  if(level < 40) return getComputedStyle(document.documentElement).getPropertyValue('--olive');
  if(level < 60) return getComputedStyle(document.documentElement).getPropertyValue('--gold');
  if(level < 80) return getComputedStyle(document.documentElement).getPropertyValue('--stamp-soft');
  return getComputedStyle(document.documentElement).getPropertyValue('--stamp');
}

function fillGauge(gauge){
  const level = typeof gauge.level === 'number' ? gauge.level : 30;
  const rotation = (level * 1.8) - 90;
  document.getElementById('gaugeNeedle').style.transform = 'rotate(' + rotation + 'deg)';
  document.getElementById('gaugeNumber').textContent = level;
  const stateEl = document.getElementById('gaugeStateLabel');
  stateEl.textContent = gauge.state || '';
  stateEl.style.color = gaugeZoneColor(level).trim();
  document.getElementById('gaugeNote').textContent = gauge.note || '';
}

function fillHoldingsWall(items){
  const wall = document.getElementById('holdingsWall');
  wall.innerHTML = '';
  if(items.length === 0){
    wall.innerHTML = '<p class="empty-col">尚無持股觀察資料</p>';
    return;
  }
  items.forEach(h=>{
    const lvl = h.level || 'warning';
    const card = document.createElement('div');
    card.className = 'light-card lvl-' + lvl;
    card.innerHTML = `
      <span class="ticker">${h.ticker || ''}</span>
      <span class="name">${h.name || ''}</span>
      <div class="note">${h.note || '今天暫無特別動態'}</div>
    `;
    wall.appendChild(card);
  });
}

function fillChainList(items){
  const list = document.getElementById('chainList');
  list.innerHTML = '';
  if(!items || items.length === 0){
    list.innerHTML = '<p class="empty-col">今天暫無相關事件</p>';
    return;
  }
  items.forEach(c=>{
    const lvl = c.level || 'warning';
    const card = document.createElement('div');
    card.className = 'chain-card';
    card.innerHTML = `
      <div class="chain-row">
        <div class="chain-seg seg-event">
          <p class="seg-label">事件</p>
          <p class="seg-text">${c.event || ''}</p>
        </div>
        <div class="chain-arrow">→</div>
        <div class="chain-seg seg-reaction">
          <p class="seg-label">市場反應</p>
          <p class="seg-text">${c.reaction || ''}</p>
        </div>
        <div class="chain-arrow">→</div>
        <div class="chain-seg seg-impact lvl-${lvl}">
          <p class="seg-label">對你的影響</p>
          <p class="seg-text">${c.impact || ''}</p>
        </div>
      </div>
      <p class="chain-conclusion">${c.conclusion || ''}</p>
      <div class="chain-source">— ${c.source || ''}</div>
    `;
    list.appendChild(card);
  });
}

loadBriefing();
