<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>綠豆湯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F0E4;
    --paper-2:#EBE3D2;
    --ink:#201C16;
    --ink-soft:#4A4438;
    --rule:#C9BFA8;
    --stamp:#A6342A;
    --stamp-soft:#C96A5A;
    --gold:#9C7A3C;
    --green:#3E6B4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:1000px;
    margin:0 auto;
    padding:28px 20px 60px;
  }

  /* Masthead */
  .masthead{
    text-align:center;
    border-bottom:4px double var(--ink);
    padding-bottom:14px;
    margin-bottom:6px;
  }
  .masthead .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .masthead h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(38px,7vw,58px);
    margin:6px 0 4px;
    letter-spacing:.06em;
  }
  .masthead .sub{
    font-family:'Noto Serif TC', serif;
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:.12em;
  }
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    padding:8px 2px 18px;
    border-bottom:1px solid var(--rule);
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:6px;
  }
  .meta-row .updated-badge{
    background:var(--ink);
    color:var(--paper);
    padding:3px 9px;
    border-radius:2px;
  }

  /* Empty state */
  .empty-state{
    text-align:center;
    padding:70px 20px;
    border:1px dashed var(--rule);
    background:var(--paper-2);
  }
  .empty-state h2{
    font-family:'Noto Serif TC', serif;
    font-size:22px;
    margin-bottom:10px;
  }
  .empty-state p{
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.8;
  }
  .empty-state code{
    background:var(--ink);
    color:var(--paper);
    padding:3px 8px;
    border-radius:3px;
    font-family:'IBM Plex Mono', monospace;
  }

  /* Section headers */
  .section-label{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 12px;
  }
  .section-label .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--paper);
    background:var(--ink);
    padding:2px 7px;
  }
  .section-label h2{
    font-family:'Noto Serif TC', serif;
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:.03em;
  }
  .section-label .rule{
    flex:1;
    height:1px;
    background:var(--rule);
  }

  /* News feed - single vertical list */
  .news-feed{
    margin-bottom:10px;
  }
  .news-item{
    padding:18px 0;
    border-bottom:1px solid var(--rule);
  }
  .news-item:first-child{padding-top:0;}
  .news-item .cat-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .cat-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.06em;
    padding:2px 8px;
    border:1px solid var(--ink);
    color:var(--ink);
  }
  .cat-tag.cat-macro{border-color:var(--gold); color:var(--gold);}
  .cat-tag.cat-us{border-color:var(--green); color:var(--green);}
  .cat-tag.cat-tw{border-color:var(--stamp); color:var(--stamp);}
  .news-item h3{
    font-family:'Noto Serif TC', serif;
    font-size:17px;
    line-height:1.5;
    margin:0 0 8px;
  }
  .news-item p{
    font-size:13.5px;
    line-height:1.85;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .source-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--gold);
    letter-spacing:.03em;
  }
  .empty-col{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
  }

  /* Holdings grid */
  .holdings-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:14px;
    margin-bottom:34px;
  }
  .holding-card{
    background:var(--paper-2);
    border:1px solid var(--rule);
    padding:14px 16px;
  }
  .holding-card .tick-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .holding-card .ticker-group{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .holding-card .weather-icon{
    font-size:18px;
    line-height:1;
  }
  .holding-card .ticker{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:15px;
  }
  .holding-card .name{
    font-size:11px;
    color:var(--ink-soft);
  }
  .holding-card .note{
    font-size:12.5px;
    line-height:1.65;
    color:var(--ink-soft);
  }

  footer{
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    padding-top:20px;
    border-top:1px solid var(--rule);
    line-height:1.8;
  }
</style>
</head>
<body>

  <div class="masthead">

    <h1>綠 豆 湯</h1>
    <div class="sub">DAILY INVESTMENT BRIEFING</div>
  </div>

  </div>

  <div id="dataNote" style="display:none; font-size:11.5px; color:var(--ink-soft); text-align:center; margin:-14px 0 22px; font-style:italic;"></div>

  <div id="emptyState" class="empty-state" style="display:none;">
    <h2>今天還沒有簡報</h2>
    <p>跟 Claude 說一聲 <code>更新今日簡報</code>，我會搜尋當天總經新聞、美股隔夜表現、台股焦點，<br>整理好之後寫進這份頁面，之後你打開永遠是同一份、看最新內容。</p>
  </div>

  <div id="content" style="display:none;">

    <div class="section-label"><span class="num">01</span><h2>持股觀察</h2><span class="rule"></span></div>
    <div class="holdings-grid" id="holdingsGrid"></div>

    <div class="section-label"><span class="num">02</span><h2>今日新聞總覽</h2><span class="rule"></span></div>
    <div class="news-feed" id="newsFeed"></div>

  </div>

  <footer>
    本頁面內容為新聞整理，非投資建議・資料由 Claude 依對話當下搜尋整理寫入<br>
    PChome 資深工程師的每日觀盤儀表板
  </footer>

</div>

async function loadBriefing(){
  let stored = null;
  try{
    stored = await window.storage.get('briefing:latest');
  }catch(e){
    stored = null;
  }

  let storedData = null;
  if(stored && stored.value){
    try{ storedData = JSON.parse(stored.value); }catch(e){ storedData = null; }
  }

  // 如果種子日期比storage新（或storage是空的），就寫入新內容
  if(!storedData || SEED_DATA.date >= storedData.date){
    try{
      await window.storage.set('briefing:latest', JSON.stringify(SEED_DATA));
    }catch(e){ /* 寫入失敗就先用種子資料顯示，不阻擋畫面 */ }
    render(SEED_DATA);
    return;
  }

  render(storedData);
}

const CAT_LABEL = { macro: '總經', us: '美股', tw: '台股' };

function render(data){
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  document.getElementById('dateLine').textContent = data.date || '';
  document.getElementById('updatedBadge').textContent = '更新於 ' + (data.updated_at || '');

  const noteEl = document.getElementById('dataNote');
  if(data.data_note){
    noteEl.textContent = data.data_note;
    noteEl.style.display = 'block';
  }else{
    noteEl.style.display = 'none';
  }

  fillHoldings(data.holdings || []);
  fillNewsFeed(data.news || []);
}

const WEATHER_ICON = {
  sunny: '☀️',
  cloudy: '⛅',
  rainy: '🌧️',
  storm: '⛈️'
};

function fillHoldings(items){
  const grid = document.getElementById('holdingsGrid');
  grid.innerHTML = '';
  if(items.length === 0){
    grid.innerHTML = '<p class="empty-col">尚無持股觀察資料</p>';
    return;
  }
  items.forEach(h=>{
    const card = document.createElement('div');
    card.className = 'holding-card';
    const icon = WEATHER_ICON[h.weather] || '⛅';
    card.innerHTML = `
      <div class="tick-row">
        <div class="ticker-group">
          <span class="weather-icon">${icon}</span>
          <span class="ticker">${h.ticker || ''}</span>
        </div>
        <span class="name">${h.name || ''}</span>
      </div>
      <div class="note">${h.note || '今天暫無特別動態'}</div>
    `;
    grid.appendChild(card);
  });
}

function fillNewsFeed(items){
  const feed = document.getElementById('newsFeed');
  feed.innerHTML = '';
  if(!items || items.length === 0){
    feed.innerHTML = '<p class="empty-col">今天暫無相關新聞</p>';
    return;
  }
  items.forEach(item=>{
    const wrap = document.createElement('div');
    wrap.className = 'news-item';

    const catRow = document.createElement('div');
    catRow.className = 'cat-row';
    const tag = document.createElement('span');
    const cat = item.category || 'macro';
    tag.className = 'cat-tag cat-' + cat;
    tag.textContent = CAT_LABEL[cat] || '焦點';
    catRow.appendChild(tag);
    wrap.appendChild(catRow);

    const h3 = document.createElement('h3');
    h3.textContent = item.title || '';
    wrap.appendChild(h3);

    const p = document.createElement('p');
    p.textContent = item.summary || '';
    wrap.appendChild(p);

    if(item.source){
      const src = document.createElement('div');
      src.className = 'source-tag';
      src.textContent = '— ' + item.source;
      wrap.appendChild(src);
    }
    feed.appendChild(wrap);
  });
}

loadBriefing();

</body>
</html>
