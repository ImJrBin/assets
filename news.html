<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>綠豆湯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F0E4;
    --paper-2:#EBE3D2;
    --ink:#201C16;
    --ink-soft:#4A4438;
    --rule:#C9BFA8;
    --stamp:#A6342A;
    --stamp-soft:#C96A5A;
    --gold:#9C7A3C;
    --green:#3E6B4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:1000px;
    margin:0 auto;
    padding:28px 20px 60px;
  }

  /* Masthead */
  .masthead{
    text-align:center;
    border-bottom:4px double var(--ink);
    padding-bottom:14px;
    margin-bottom:6px;
  }
  .masthead .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--ink-soft);
    text-transform:uppercase;
  }
  .masthead h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(38px,7vw,58px);
    margin:6px 0 4px;
    letter-spacing:.06em;
  }
  .masthead .sub{
    font-family:'Noto Serif TC', serif;
    font-size:14px;
    color:var(--ink-soft);
    letter-spacing:.12em;
  }
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    padding:8px 2px 18px;
    border-bottom:1px solid var(--rule);
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:6px;
  }
  .meta-row .updated-badge{
    background:var(--ink);
    color:var(--paper);
    padding:3px 9px;
    border-radius:2px;
  }

  /* Empty state */
  .empty-state{
    text-align:center;
    padding:70px 20px;
    border:1px dashed var(--rule);
    background:var(--paper-2);
  }
  .empty-state h2{
    font-family:'Noto Serif TC', serif;
    font-size:24px;
    margin-bottom:10px;
  }
  .empty-state p{
    color:var(--ink-soft);
    font-size:15px;
    line-height:1.8;
  }
  .empty-state code{
    background:var(--ink);
    color:var(--paper);
    padding:3px 8px;
    border-radius:3px;
    font-family:'IBM Plex Mono', monospace;
  }

  /* Section headers */
  .section-label{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 12px;
  }
  .section-label .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--paper);
    background:var(--ink);
    padding:2px 7px;
  }
  .section-label h2{
    font-family:'Noto Serif TC', serif;
    font-size:21px;
    font-weight:700;
    margin:0;
    letter-spacing:.03em;
  }
  .section-label .rule{
    flex:1;
    height:1px;
    background:var(--rule);
  }

  /* News feed - single vertical list */
  .news-feed{
    margin-bottom:10px;
  }
  .news-item{
    padding:18px 0;
    border-bottom:1px solid var(--rule);
  }
  .news-item:first-child{padding-top:0;}
  .news-item .cat-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:6px;
  }
  .cat-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.06em;
    padding:2px 8px;
    border:1px solid var(--ink);
    color:var(--ink);
  }
  .cat-tag.cat-macro{border-color:var(--gold); color:var(--gold);}
  .cat-tag.cat-us{border-color:var(--green); color:var(--green);}
  .cat-tag.cat-tw{border-color:var(--stamp); color:var(--stamp);}
  .news-item h3{
    font-family:'Noto Serif TC', serif;
    font-size:19px;
    line-height:1.5;
    margin:0 0 8px;
  }
  .news-item p{
    font-size:15px;
    line-height:1.85;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .source-tag{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--gold);
    letter-spacing:.03em;
  }
  .empty-col{
    font-size:14px;
    color:var(--ink-soft);
    font-style:italic;
  }

  /* Holdings grid */
  .holdings-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:14px;
    margin-bottom:34px;
  }
  .holding-card{
    background:var(--paper-2);
    border:1px solid var(--rule);
    padding:14px 16px;
  }
  .holding-card .tick-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:6px;
  }
  .holding-card .ticker-group{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .holding-card .weather-icon{
    font-size:20px;
    line-height:1;
  }
  .holding-card .ticker{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:16px;
  }
  .holding-card .name{
    font-size:12px;
    color:var(--ink-soft);
  }
  .holding-card .note{
    font-size:14px;
    line-height:1.65;
    color:var(--ink-soft);
  }

  /* Sentiment gauge */
  .gauge-wrap{
    margin-bottom:30px;
  }
  .gauge-label-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .gauge-label-row .gauge-title{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:16px;
  }
  .gauge-label-row .gauge-state{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.05em;
  }
  .gauge-track{
    position:relative;
    height:10px;
    border-radius:5px;
    background:linear-gradient(to right, var(--green), var(--gold), var(--stamp));
    margin-bottom:6px;
  }
  .gauge-marker{
    position:absolute;
    top:-5px;
    width:2px;
    height:20px;
    background:var(--ink);
  }
  .gauge-scale{
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .gauge-note{
    font-size:14px;
    line-height:1.75;
    color:var(--ink-soft);
  }

  /* Holdings light-wall */
  .holdings-wall{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:10px;
    margin-bottom:34px;
  }
  .light-card{
    border-radius:8px;
    padding:12px 14px;
    border:1px solid var(--rule);
  }
  .light-card.lvl-danger{ background:#F3D9D3; border-color:var(--stamp); }
  .light-card.lvl-warning{ background:var(--paper-2); border-color:var(--gold); }
  .light-card.lvl-success{ background:#E1E9DE; border-color:var(--green); }
  .light-card .ticker{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:16px;
    display:block;
  }
  .light-card .name{
    font-size:12px;
    color:var(--ink-soft);
    display:block;
    margin-bottom:6px;
  }
  .light-card .note{
    font-size:14px;
    line-height:1.6;
    color:var(--ink-soft);
  }

  /* Event chain */
  .chain-list{
    display:flex;
    flex-direction:column;
    gap:16px;
    margin-bottom:10px;
  }
  .chain-card{
    border:1px solid var(--rule);
    padding:16px;
  }
  .chain-row{
    display:flex;
    align-items:stretch;
    gap:0;
    flex-wrap:wrap;
  }
  .chain-seg{
    flex:1;
    min-width:150px;
    padding:10px 12px;
  }
  .chain-seg .seg-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.05em;
    margin:0 0 4px;
  }
  .chain-seg .seg-text{
    font-family:'Noto Serif TC', serif;
    font-size:15px;
    line-height:1.5;
    margin:0;
  }
  .chain-seg.seg-event{ background:var(--paper-2); }
  .chain-seg.seg-reaction{ background:#F0E4CB; }
  .chain-seg.seg-impact.lvl-danger{ background:#F3D9D3; }
  .chain-seg.seg-impact.lvl-warning{ background:#F0E4CB; }
  .chain-seg.seg-impact.lvl-success{ background:#E1E9DE; }
  .chain-seg.seg-event .seg-label{ color:var(--ink-soft); }
  .chain-seg.seg-reaction .seg-label{ color:var(--gold); }
  .chain-seg.seg-impact.lvl-danger .seg-label{ color:var(--stamp); }
  .chain-seg.seg-impact.lvl-warning .seg-label{ color:var(--gold); }
  .chain-seg.seg-impact.lvl-success .seg-label{ color:var(--green); }
  .chain-arrow{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 6px;
    color:var(--ink-soft);
    font-size:16px;
  }
  .chain-conclusion{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.75;
    margin:10px 0 4px;
  }
  .chain-source{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--gold);
  }

  @media (max-width:600px){
    .chain-row{
      flex-direction:column;
    }
    .chain-seg{
      min-width:100%;
    }
    .chain-arrow{
      transform:rotate(90deg);
      padding:2px 0;
    }
    .holdings-wall{
      grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
    }
    .masthead h1{
      letter-spacing:.03em;
    }
  }
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    padding-top:20px;
    border-top:1px solid var(--rule);
    line-height:1.8;
  }
</style>
</head>

  </div>

  <footer></footer>

</div>

async function loadBriefing(){
  let stored = null;
  try{
    stored = await window.storage.get('briefing:latest');
  }catch(e){
    stored = null;
  }

  let storedData = null;
  if(stored && stored.value){
    try{ storedData = JSON.parse(stored.value); }catch(e){ storedData = null; }
  }

  // 如果種子日期比storage新（或storage是空的），就寫入新內容
  if(!storedData || SEED_DATA.date >= storedData.date){
    try{
      await window.storage.set('briefing:latest', JSON.stringify(SEED_DATA));
    }catch(e){ /* 寫入失敗就先用種子資料顯示，不阻擋畫面 */ }
    render(SEED_DATA);
    return;
  }

  render(storedData);
}

function render(data){
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  document.getElementById('dateLine').textContent = data.date || '';
  document.getElementById('updatedBadge').textContent = '更新於 ' + (data.updated_at || '');

  const noteEl = document.getElementById('dataNote');
  if(data.data_note){
    noteEl.textContent = data.data_note;
    noteEl.style.display = 'block';
  }else{
    noteEl.style.display = 'none';
  }

  fillGauge(data.gauge || {});
  fillHoldingsWall(data.holdings || []);
  fillChainList(data.chains || []);
}

function fillGauge(gauge){
  const level = typeof gauge.level === 'number' ? gauge.level : 30;
  document.getElementById('gaugeMarker').style.left = level + '%';
  document.getElementById('gaugeStateLabel').textContent = gauge.state || '';
  document.getElementById('gaugeNote').textContent = gauge.note || '';
}

function fillHoldingsWall(items){
  const wall = document.getElementById('holdingsWall');
  wall.innerHTML = '';
  if(items.length === 0){
    wall.innerHTML = '<p class="empty-col">尚無持股觀察資料</p>';
    return;
  }
  items.forEach(h=>{
    const lvl = h.level || 'warning';
    const card = document.createElement('div');
    card.className = 'light-card lvl-' + lvl;
    card.innerHTML = `
      <span class="ticker">${h.ticker || ''}</span>
      <span class="name">${h.name || ''}</span>
      <div class="note">${h.note || '今天暫無特別動態'}</div>
    `;
    wall.appendChild(card);
  });
}

function fillChainList(items){
  const list = document.getElementById('chainList');
  list.innerHTML = '';
  if(!items || items.length === 0){
    list.innerHTML = '<p class="empty-col">今天暫無相關事件</p>';
    return;
  }
  items.forEach(c=>{
    const lvl = c.level || 'warning';
    const card = document.createElement('div');
    card.className = 'chain-card';
    card.innerHTML = `
      <div class="chain-row">
        <div class="chain-seg seg-event">
          <p class="seg-label">事件</p>
          <p class="seg-text">${c.event || ''}</p>
        </div>
        <div class="chain-arrow">→</div>
        <div class="chain-seg seg-reaction">
          <p class="seg-label">市場反應</p>
          <p class="seg-text">${c.reaction || ''}</p>
        </div>
        <div class="chain-arrow">→</div>
        <div class="chain-seg seg-impact lvl-${lvl}">
          <p class="seg-label">對你的影響</p>
          <p class="seg-text">${c.impact || ''}</p>
        </div>
      </div>
      <p class="chain-conclusion">${c.conclusion || ''}</p>
      <div class="chain-source">— ${c.source || ''}</div>
    `;
    list.appendChild(card);
  });
}

loadBriefing();
</script>
</body>
</html>
