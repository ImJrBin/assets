<style>
/* Layout: full-bleed daytime 3D island scene; ledger card top-left, view toolbar + scenario dock top-right, drawer for list/roles, detail sheet bottom. Single daytime look by choice. */
:root{
  --sky-top:#b9dde4; --sky-bot:#f4f1de;
  color-scheme:light;
  --ink:#22312f; --ink-2:#5b6b67;
  --paper:#fbfaf5; --paper-line:#e2e4da;
  --accent:#c8623a;          /* 赤陶，用於選取與強調 */
  --sea:#4f9aa3;
  --ok:#3f8a5a; --warn:#c08a1e; --bad:#b84a3a;
  --chip-bg:rgba(251,250,245,.92);
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-display:var(--font-body);
  --font-num:var(--font-body);
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:linear-gradient(var(--sky-top),var(--sky-bot));color:var(--ink);font-family:var(--font-body);overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* labels */
#labels{position:fixed;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;color:var(--ink);font-family:var(--font-body);-webkit-appearance:none;appearance:none;margin:0;
  display:flex;align-items:baseline;gap:6px;white-space:nowrap;
  background:var(--chip-bg);border:1px solid var(--paper-line);border-radius:999px;
  padding:5px 11px 5px 9px;font-size:13px;font-weight:500;box-shadow:0 2px 8px rgba(30,50,48,.12);
  transition:opacity .3s, transform .15s}
.tag:hover,.tag.sel{border-color:var(--accent)}
.tag.sel{transform:translate(-50%,-100%) scale(1.06)}
.tag b{font-family:var(--font-num);font-size:11px;color:var(--accent);font-weight:500}
.tag small{font-family:var(--font-num);font-size:11px;color:var(--ink-2)}
.tag small i,.li i,#delta i,#sheet i.up,#sheet i.down{font-style:normal;font-size:11px;margin-left:4px}
i.up{color:var(--ok)} i.down{color:var(--bad)}
#auth{margin-top:8px;display:grid;gap:6px}
#auth button,.linkbtn{all:unset;cursor:pointer}
#auth .go{background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 12px;font-size:13.5px;font-weight:500;text-align:center}
#auth .go:focus-visible,.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#auth p{margin:0;font-size:12px;color:var(--ink-2);line-height:1.5}
.linkbtn{color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:2px}

const CLIENT_ID='270448495509-op34d900ith13gt6j9v510dac1ll96tp.apps.googleusercontent.com';

  if(h.get('access_token')&&h.get('state')===st)LS.set('ai_tok',{t:h.get('access_token'),exp:Date.now()+(+h.get('expires_in')-60)*1000});

  const r=await fetch(url,{headers:{Authorization:'Bearer '+token()}});
  const j=await r.json().catch(()=>({}));

function parseTab(rows){
  const items=[];
  for(let r=2;r<rows.length;r++){
    const label=String(rows[r]?.[4]??'').trim();
    if(label==='合計')break;
    if(!label||label==='資產')continue;
    const v=num(rows[r]?.[5]);if(isNaN(v))continue;
    items.push({label,name:prettyName(label),value:v,island:islandOf(label)});
  }
  let up=rows[0]?.[9]??'';
  if(typeof up==='number'){const d=new Date(Date.UTC(1899,11,30)+up*864e5);up=`${d.getUTCFullYear()}/${d.getUTCMonth()+1}/${d.getUTCDate()}`}
  return{items,updated:String(up)};
}
async function loadFromSheets(){
  let files=[];
  try{
    const q=encodeURIComponent("name contains 'Balance Sheet_' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false");
    files=(await gget(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=20`)).files||[];
    files=files.filter(f=>/Balance Sheet_\d{4}$/.test(f.name)).sort((a,b)=>b.name.localeCompare(a.name));
  }catch(e){if(e.status===401)throw e}
  if(!files.length)files=[{id:FALLBACK_SHEET,name:'Balance Sheet_2026'}];
  const tabs=[];
  for(const f of files.slice(0,2)){
    const meta=await gget(`https://sheets.googleapis.com/v4/spreadsheets/${f.id}?fields=sheets.properties.title`);
    meta.sheets.map(x=>x.properties.title).filter(t=>/^\d{6}$/.test(t)).forEach(t=>tabs.push({id:f.id,t}));
    if(tabs.length>=2)break;
  }
  tabs.sort((a,b)=>b.t.localeCompare(a.t));
  const [cur,prev]=tabs;if(!cur)throw new Error('找不到 YYYYMM 格式的月份分頁');
  const get=async x=>(await gget(`https://sheets.googleapis.com/v4/spreadsheets/${x.id}/values/${encodeURIComponent(`'${x.t}'!A1:J45`)}?valueRenderOption=UNFORMATTED_VALUE`)).values||[];
  const c=parseTab(await get(cur));
  const out={month:cur.t,updated:c.updated,items:c.items,syncedAt:Date.now()};
  if(prev){
    const p=parseTab(await get(prev));
    out.prevMonth=prev.t;out.prevTotal=p.items.reduce((a,x)=>a+x.value,0);
    // 舊月份若還沒拆成各檔明細（例如 2026/6 以前），就只比總額
    if(p.items.some(x=>x.island==='core')){out.prev={};p.items.forEach(x=>out.prev[x.island]=(out.prev[x.island]||0)+x.value)}
  }
  return out;
}

const WX_PRESET={
  clear:{label:'晴',c:.05,r:0},cloudy:{label:'多雲',c:.45,r:0},overcast:{label:'陰',c:.9,r:0},
  rain:{label:'雨',c:.95,r:.7},storm:{label:'雷雨',c:1,r:1,thunder:true},fog:{label:'霧',c:.7,r:0,fog:true}
};
function fromCode(code,cc){
  if(code<=1)return{key:'clear',label:code?'晴時多雲':'晴',c:Math.max(.05,(cc??10)/100*.6),r:0};
  if(code===2)return{key:'cloudy',label:'多雲',c:.45,r:0};
  if(code===3)return{key:'overcast',label:'陰',c:.9,r:0};
  if(code===45||code===48)return{key:'fog',label:'霧',c:.7,r:0,fog:true};
  if(code>=51&&code<=57)return{key:'rain',label:'毛毛雨',c:.85,r:.3};
  if(code===61||code===80)return{key:'rain',label:code===80?'陣雨':'小雨',c:.9,r:.5};
  if(code===63||code===81||code===66)return{key:'rain',label:code===81?'陣雨':'中雨',c:.95,r:.75};
  if(code===65||code===82||code===67)return{key:'rain',label:'大雨',c:1,r:1};
  if(code>=71&&code<=86)return{key:'rain',label:'雨雪',c:.95,r:.5};
  if(code>=95)return{key:'storm',label:'雷雨',c:1,r:1,thunder:true};
  return{key:'cloudy',label:'多雲',c:.45,r:0};
}
let wxLive=null,wxOverride='auto',timeOverride='auto',wxFetchedAt=0;
const taipeiMin=()=>((Date.now()/60000+480)%1440+1440)%1440;
function approxSun(){ // 台北日出日落近似值（無網路時用）
  const d=new Date(Date.now()+8*3600e3),doy=Math.floor((d-Date.UTC(d.getUTCFullYear(),0,1))/864e5);
  const k=Math.cos(2*Math.PI*(doy+10)/365);
  return{sr:(5.85+.8*k)*60,ss:(17.95-.85*k)*60};
}
function phase(){
  if(timeOverride!=='auto')return[timeOverride,timeOverride,0];
  const {sr,ss}=wxLive??approxSun(),m=taipeiMin();
  if(m<sr-50)return['night','night',0];
  if(m<sr)return['night','dawn',(m-(sr-50))/50];
  if(m<sr+60)return['dawn','day',(m-sr)/60];
  if(m<ss-60)return['day','day',0];
  if(m<ss)return['day','dusk',(m-(ss-60))/60];
  if(m<ss+50)return['dusk','night',(m-ss)/50];
  return['night','night',0];
}
function currentWx(){
  if(wxOverride!=='auto')return{key:wxOverride,...WX_PRESET[wxOverride]};
  if(wxLive)return fromCode(wxLive.code,wxLive.cc);
  return{key:'clear',label:'依時間',c:.15,r:0};
}
const hsl={};
function weather(col,c,r){col.getHSL(hsl);col.setHSL(hsl.h,hsl.s*(1-Math.max(0,c-.2)*.75),hsl.l*(1-.18*r-.06*c));return col}
let TGT=null,CUR=null;
function retarget(){
  const [a,b,t]=phase(),A=PAL[a],B=PAL[b],w=currentWx();
  const o={};
  COLS.forEach(k=>{o[k]=weather(C(A[k]).lerp(C(B[k]),t),w.c,w.r)});
  ['hi','ai','si','L'].forEach(k=>o[k]=A[k]+(B[k]-A[k])*t);
  o.sp=new THREE.Vector3(...A.sp).lerp(new THREE.Vector3(...B.sp),t);
  o.si*=(1-.7*Math.max(0,w.c-.2)/.8)*(1-.5*w.r);o.hi*=(1-.12*w.c);o.ai+=.1*w.c;
  o.cloud=C(0xffffff).lerp(C(0x8d979c),Math.min(1,w.c*.6+w.r*.5)).multiplyScalar(.35+.65*o.L);
  o.rain=w.r;o.lights=Math.min(1,Math.max(0,(1-o.L)*1.6+.2*w.r));o.stars=Math.pow(1-o.L,2)*(1-w.c);o.moon=(1-o.L)*(1-w.c*.85);
  o.fn=w.fog?18:w.r>.5?70:130;o.ff=w.fog?105:w.r>.5?190:260;
  o.cloudN=Math.round(4+w.c*14);o.cloudY=w.c>.8?20:28;
  o.thunder=!!w.thunder;o.night=o.L<.3;o.w=w;
  TGT=o;
  if(!CUR){CUR={};for(const k in o)CUR[k]=o[k]?.clone?o[k].clone():o[k]}
  umbrellas.forEach(u=>u.visible=w.r>.15);
  clouds.forEach((c,i)=>c.visible=i<o.cloudN);
  updateWxButton();
}

let flash=0;
const meta=document.querySelector('meta[name="theme-color"]');
function applyWx(dt){
  if(!TGT)return;
  const k=CUR._init?1-Math.exp(-dt*1.2):1;CUR._init=true;
  for(const key in TGT){const v=TGT[key];if(v?.isColor||v?.isVector3)CUR[key].lerp(v,k);else if(typeof v==='number')CUR[key]+=(v-CUR[key])*k;else CUR[key]=v}
  if(TGT.thunder&&!reduce&&Math.random()<dt*.16)flash=1;
  flash*=Math.exp(-dt*7);
  hemi.color.copy(CUR.hs);hemi.groundColor.copy(CUR.hg);hemi.intensity=CUR.hi+flash*2.2;
  amb.intensity=CUR.ai+flash*1.4;
  sun.color.copy(CUR.sc);sun.intensity=CUR.si;sun.position.copy(CUR.sp);
  seaMat.color.copy(CUR.sea);floorMat.color.copy(CUR.sea).multiplyScalar(.82);
  scene.fog.color.copy(CUR.fog);scene.fog.near=CUR.fn;scene.fog.far=CUR.ff;
  cloudMat.color.copy(CUR.cloud);
  mats.glass.emissiveIntensity=CUR.lights*.42;lampMat.emissiveIntensity=.3+CUR.lights*1.8;
  starMat.opacity=CUR.stars;moonMat.opacity=CUR.moon;moon.visible=CUR.moon>.02;
  rainMat.opacity=CUR.rain>.02?Math.min(.7,.28+CUR.rain*.42):0;rainLines.visible=CUR.rain>.02;
  if(rainLines.visible){
    rainGeo.setDrawRange(0,Math.floor(RAIN_N*Math.min(1,CUR.rain+.15))*2);
    const sp=(reduce?10:34)*dt;
    for(let i=0;i<RAIN_N;i++){const o=i*6;rainPos[o+1]-=sp;rainPos[o+4]-=sp;if(rainPos[o+4]<0){rainPos[o+1]+=45;rainPos[o+4]+=45}}
    rainGeo.attributes.position.needsUpdate=true;
    rainLines.position.set(controls.target.x,0,controls.target.z);
  }
  clouds.forEach(c=>{c.position.y+=(CUR.cloudY+(c.userData.y0-28)*.4-c.position.y)*k});
  const top=CUR.top.clone().lerp(C(0xffffff),flash*.6),bot=CUR.bot.clone().lerp(C(0xffffff),flash*.4);
  const rs=document.documentElement.style;rs.setProperty('--sky-top','#'+top.getHexString());rs.setProperty('--sky-bot','#'+bot.getHexString());
  if(meta&&Math.random()<.05)meta.content='#'+CUR.top.getHexString();
}

async function fetchWx(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${WX_LAT}&longitude=${WX_LON}&current=temperature_2m,weather_code,cloud_cover,precipitation&daily=sunrise,sunset&timezone=Asia%2FTaipei&forecast_days=1`;
    const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);
    const j=await r.json(),hm=s=>{const[h,m]=s.slice(11,16).split(':');return +h*60+ +m};
    wxLive={code:j.current.weather_code,temp:j.current.temperature_2m,precip:j.current.precipitation,cc:j.current.cloud_cover,sr:hm(j.daily.sunrise[0]),ss:hm(j.daily.sunset[0]),at:new Date()};
  }catch(e){if(!wxLive)wxLive=null}
  wxFetchedAt=Date.now();retarget();
}
setInterval(()=>{if(Date.now()-wxFetchedAt>15*60e3)fetchWx();else retarget()},60e3);

  <div class="hint">「實況」跟著${WX_CITY}現在的天氣與日出日落變化，每 15 分鐘更新。其他選項只是預覽，重新打開 App 會回到實況。</div>`;
  drawer.querySelector('.x').addEventListener('click',()=>setDrawer(null));
  drawer.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.g==='w')wxOverride=b.dataset.v;else timeOverride=b.dataset.v;retarget()}));
}
const v3=new THREE.Vector3();const clock=new THREE.Clock();
function placeTag(el,x,y,z){
  v3.set(x,y,z).project(camera);
  if(v3.z>1){el.style.opacity=0;return}
  el.style.left=((v3.x+1)/2*innerWidth)+'px';el.style.top=((1-v3.y)/2*innerHeight)+'px';
}
function tick(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(fly){fly.k=Math.min(1,fly.k+dt*1.6);const e=reduce?1:.08+fly.k*.1;camera.position.lerp(fly.p,e);controls.target.lerp(fly.t,e);if(camera.position.distanceTo(fly.p)<.05)fly=null}
  controls.update();
  ISLANDS.forEach(i=>{
    i.cur+=(i.goal-i.cur)*(reduce?1:Math.min(1,dt*2.5));
    if(growAt<t)i.base+=(i.baseGoal-i.base)*Math.min(1,dt*(reduce?99:.9));
    const s=Math.sqrt(Math.max(i.cur,0.0001))*i.base;
    i.body.scale.set(Math.max(s,.25),1,Math.max(s,.25));
    const sink=(1-i.cur)*1.3+(i.cur<0.02?1.4:0);
    i.body.position.y=-sink+(reduce?0:Math.sin(t*.8+i.pos[0])*.04);
    i.ring.material.opacity+=(((selected===i||(roleSel&&ROLE_OF[i.id]===roleSel))?.55:0)-i.ring.material.opacity)*.15;
    i.spin?.forEach(h=>h.rotation.z-=dt*1.4);
    i.tag.style.opacity='';
    placeTag(i.tag,i.pos[0],2.2+(i.kind==='city'?6:i.kind==='lighthouse'?4:1.5)-sink,i.pos[1]);
  });
  HOME.tag.style.opacity='';updateWalkers(dt,t);
  bridges.forEach(b=>{b.g.visible=b.A.cur>.55&&b.B.cur>.55});
  ISLANDS.forEach(i=>{if(i.globe&&!reduce)i.globe.rotation.y+=dt*.6;if(i.jet&&!reduce)i.jet.scale.y=1+Math.sin(t*4)*.15;if(i.crane&&!reduce)i.crane.rotation.y=Math.sin(t*.3)*.6;if(i.tower&&!reduce)i.tower.rotation.y=Math.sin(t*.22+1)*.9});placeTag(HOME.tag,HOME.pos[0],5,HOME.pos[1]);
  const lev=ISLANDS.find(i=>i.lev);if(lev.lamp&&!reduce)lev.lamp.material.emissiveIntensity=1+Math.sin(t*3)*.5;
  if(!reduce){
    clouds.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>70)c.position.x=-70});
    boats.forEach(b=>{const u=b.userData;u.a+=u.v*dt;b.position.set(Math.cos(u.a)*u.d,.05+Math.sin(t*1.5+u.ph)*.06,Math.sin(u.a)*u.d*.7);b.rotation.y=-u.a+(u.v>0?0:Math.PI)})
  }
  applyWx(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
const drawer=document.getElementById('drawer'),tRole=document.getElementById('tRole'),tList=document.getElementById('tList');
const GRP=[['tw','台股'],['us','美股與全球'],['edu','教育金'],['cash','現金'],['other','其他']];
function renderDrawer(){
  if(!drawerMode){drawer.hidden=true;return}
  drawer.hidden=false;
  if(drawerMode==='wx'){renderWx();return}
  const total=ISLANDS.reduce((a,i)=>a+valNow(i),0);
  if(drawerMode==='list'){
    drawer.innerHTML='<div class="hd"><h3>清單</h3><button class="x" type="button" aria-label="關閉">×</button></div>'+
    GRP.map(([g,gn])=>{const is=ISLANDS.filter(i=>i.grp===g).sort((a,b)=>b.value-a.value);
      const sum=is.reduce((a,i)=>a+valNow(i),0);
      return `<div class="grp"><h4><span>${gn}</span><span class="num">${(sum/total*100).toFixed(1)}%</span></h4>`+
      is.map(i=>`<button class="li" type="button" data-id="${i.id}"><span class="dot" style="background:${grpColor[g]}"></span><span>${i.name}</span><span class="num">${fmtW(valNow(i))}${scen==='now'?chg(i.value,i.prev):''}</span><span class="pct num">${(valNow(i)/total*100).toFixed(1)}%</span></button>`).join('')+'</div>'}).join('');
    drawer.querySelectorAll('.li').forEach(b=>b.addEventListener('click',()=>{select(ISLANDS.find(i=>i.id===b.dataset.id));if(innerWidth<=640)setDrawer(null)}));
  }else{
    drawer.innerHTML='<div class="hd"><h3>資金角色</h3><button class="x" type="button" aria-label="關閉">×</button></div><div class="hint">每座島在家裡扮演的角色。點一個，地圖上會圈出屬於它的島。</div><div class="roles">'+
    ROLES.map(r=>{const v=ISLANDS.filter(i=>ROLE_OF[i.id]===r.id).reduce((a,i)=>a+valNow(i),0);
      return `<button class="role" type="button" data-r="${r.id}" aria-pressed="${roleSel===r.id}"><span class="t"><span>${r.name}</span><span class="num">${fmtW(v)}・${(v/total*100).toFixed(1)}%</span></span><span class="d">${r.d}</span></button>`}).join('')+'</div>';
    drawer.querySelectorAll('.role').forEach(b=>b.addEventListener('click',()=>{roleSel=roleSel===b.dataset.r?null:b.dataset.r;applyRole();renderDrawer()}));
  }
  drawer.querySelector('.x').addEventListener('click',()=>setDrawer(null));
}
function applyRole(){ISLANDS.forEach(i=>i.tag.classList.toggle('dim',!!roleSel&&ROLE_OF[i.id]!==roleSel));HOME.tag.classList.toggle('dim',!!roleSel)}
function setDrawer(m){
  drawerMode=m;tRole.setAttribute('aria-pressed',m==='role');tList.setAttribute('aria-pressed',m==='list');tWx.setAttribute('aria-pressed',m==='wx');
  if(m!=='role'){roleSel=null;applyRole()}
  renderDrawer();
}
tRole.addEventListener('click',()=>setDrawer(drawerMode==='role'?null:'role'));
tList.addEventListener('click',()=>setDrawer(drawerMode==='list'?null:'list'));
const tWx=document.getElementById('tWx');tWx.addEventListener('click',()=>setDrawer(drawerMode==='wx'?null:'wx'));
document.getElementById('tAll').addEventListener('click',()=>{setDrawer(null);clearSel()});
addEventListener('keydown',e=>{if(e.key==='Escape'){setDrawer(null);clearSel()}});
const _upd=updateLedger;updateLedger=function(){_upd();if(drawerMode)renderDrawer()};
let preview=false;
function renderGate(){
  const g=document.getElementById('gate');
  const show=DEMO&&!preview;
  document.body.classList.toggle('gated',show);g.hidden=!show;
  if(!show)return;
  const icon=document.querySelector('link[rel="apple-touch-icon"]')?.href||'';
  const busy=AUTH_OK&&!!token()&&!authMsg;
  let body;
  if(!AUTH_OK)body=`<p>這個預覽環境沒辦法登入 Google。請從 GitHub Pages 上的版本打開。</p>
    <button class="glink" id="gPreview" type="button">先看示意畫面（不含任何金額）</button>`;
  else if(busy)body=`<div class="gspin" role="status" aria-label="讀取中"></div><p>正在讀取資產負債表…</p>`;
  else body=`${authMsg?`<div class="gerr">${authMsg}</div>`:''}
    <button class="gbtn" id="gSignin" type="button">使用 Google 帳號登入</button>
    <p class="gnote">只會讀取試算表，不會修改。讀到的資料只暫存在這台裝置，隨時可以登出清除。</p>`;
  g.innerHTML=`<div class="gcard">${icon?`<img src="${icon}" alt="">`:''}<h1>家庭資產島</h1>
    <p>連接你的 Google Drive，自動讀取最新月份的 Balance Sheet。<br>每座島的大小，就是那筆資產的份量。</p>${body}</div>`;
  const b=document.getElementById('gSignin');if(b)b.onclick=()=>{b.disabled=true;b.textContent='前往 Google…';signIn(false)};
  const pv=document.getElementById('gPreview');if(pv)pv.onclick=()=>{preview=true;renderGate();resize()};
}
function renderAuth(){
  renderGate();
  const a=document.getElementById('auth'),sy=document.getElementById('sync'),sub=document.getElementById('sub');
  const fmtD=ts=>{const d=new Date(ts);return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
  sub.textContent=DEMO?'示意畫面・未登入':`資產負債表 ${DATA.month}${DATA.updated?' · '+DATA.updated+' 更新':''}`;
  if(DEMO){
    a.innerHTML=AUTH_OK?`<button class="go" id="signin" type="button">用 Google 登入，載入我的資產</button><p>只讀取你的「Balance Sheet」試算表，網頁本身不存任何金額。${authMsg?'<br>'+authMsg:''}</p>`
      :`<p>這是示意畫面。要看自己的資產，請從 GitHub Pages 上的版本打開並登入。</p>`;
    sy.innerHTML='';
  }else{
    a.innerHTML=authMsg?`<p>${authMsg}　<button class="linkbtn" id="signin" type="button">重新登入</button></p>`:'';
    sy.innerHTML=`<span>同步於 ${fmtD(DATA.syncedAt)}</span>${AUTH_OK?'<button class="linkbtn" id="resync" type="button">立即同步</button><button class="linkbtn" id="signout" type="button">登出並清除</button>':''}`;
  }
  const on=(id,fn)=>{const b=document.getElementById(id);if(b)b.onclick=e=>{e.stopPropagation();fn()}};
  on('signin',()=>signIn(false));on('resync',()=>token()?syncNow():signIn(false));on('signout',signOut);
}
async function syncNow(){
  try{
    const d=await loadFromSheets();
    LS.set('ai_data',d);authMsg='';
    if(DEMO){location.reload();return}
    // 已在畫面上：數字有變就讓島慢慢長大／縮小
    DATA=d;
    ISLANDS.forEach(i=>{
      const nv=d.items.filter(x=>x.island===i.id).reduce((a,x)=>a+x.value,0);
      i.baseGoal=i.value?i.baseGoal*Math.sqrt(Math.max(nv,1)/Math.max(i.value,1)):1;
      i.items=d.items.filter(x=>x.island===i.id).map(x=>[x.name,x.value]);i.value=nv;i.prev=d.prev?.[i.id];
    });
    TOTAL0=ISLANDS.reduce((a,i)=>a+i.value,0);
    updateLedger();if(drawerMode)renderDrawer();
  }catch(e){
    if(e.status===401){LS.del('ai_tok');authMsg='登入已過期';}
    else authMsg='讀取失敗：'+e.message;
    renderAuth();
  }
}
function autoSync(){
  if(!AUTH_OK)return;
  if(token()){syncNow();return}
  const age=Date.now()-(DATA.syncedAt||0),lastTry=LS.get('ai_try')||0;
  // 已登入過、資料超過 12 小時、而且 10 分鐘內沒試過 → 靜默換一張新的通行證（通常一閃而過）
  if(!DEMO&&age>12*3600e3&&Date.now()-lastTry>10*60e3&&!authMsg)signIn(true);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&token()&&Date.now()-(DATA.syncedAt||0)>30*60e3)syncNow()});
retarget();fetchWx();
updateLedger();tick();autoSync();
</script>
