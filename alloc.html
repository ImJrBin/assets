<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="資產占比">
<meta name="theme-color" content="#0f0f11">
<style>
  :root{
    --bg:#0f0f11; --surface:#18181c; --surface2:#1f1f25;
    --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12);
    --text:#f0f0f2; --text2:#8888a0; --text3:#55556a;
    --accent:#7c6af7; --accent2:#a89af9; --teal:#56c4c4; --amber:#f0a050;
    --r:12px; --r-sm:8px;
  }
  *{box-sizing:border-box}
  html{color-scheme:dark;-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:15px/1.5 "DM Sans","Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:1000px;margin:0 auto;padding:16px 16px 40px}
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
  h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.02em}
  .sub{margin:2px 0 0;font-size:12px;color:var(--text2)}
  button{font:inherit;color:inherit;cursor:pointer}
  .ibtn{
    flex:none;width:44px;height:44px;border-radius:var(--r-sm);border:1px solid var(--border2);
    background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1;
  }
  .ibtn:disabled{opacity:.3;cursor:default}
  .ibtn:not(:disabled):active{background:var(--surface2)}

  .datebar{display:flex;align-items:center;gap:8px;margin:0 auto 12px;max-width:560px}
  .datebar .mid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
  .datebar input[type=date]{
    width:100%;max-width:210px;height:44px;text-align:center;border-radius:var(--r-sm);
    border:1px solid var(--border2);background:var(--surface);color:var(--text);
    font:500 16px "DM Mono",ui-monospace,monospace;padding:0 8px;
  }
  .wd{font-size:12px;color:var(--text2)}
  .today{
    flex:none;height:44px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border2);
    background:var(--surface);font-size:13px;color:var(--accent2);
  }

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .chart-wrap{position:relative;height:280px}
  .tot-row{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
  .cols{display:grid;grid-template-columns:1fr;gap:0 12px;align-items:start}
  @media(min-width:780px){.cols{grid-template-columns:1fr 1fr}}
  .ctitle{margin:0 0 2px;font-size:13px;font-weight:500;color:var(--text2);letter-spacing:.06em;text-align:center}
  .sumcard{max-width:560px;margin:0 auto 12px}
  .note{max-width:560px;margin-left:auto;margin-right:auto}
  .tot-row .k{font-size:11px;color:var(--text2);letter-spacing:.08em}
  .tot-row .v{font:500 18px "DM Mono",ui-monospace,monospace}
  .tot-row .d{font-size:11px;color:var(--text3)}

  .mbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:2px 0 10px}
  .mbar i{display:block;height:100%}
  .mrow{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text2);flex-wrap:wrap}
  .mrow b{color:var(--text);font-weight:500;font-family:"DM Mono",ui-monospace,monospace}
  .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:baseline}

  .lg .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
  .lg .row:last-child{border-bottom:0}
  .lg .dot{flex:none;width:12px;height:12px;border-radius:3px}
  .lg .nm{flex:1;min-width:0}
  .lg .nm b{font-weight:500}
  .lg .nm small{color:var(--text2);margin-left:6px;font-size:12px}
  .lg .nm .tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:99px;font-size:10px;line-height:16px;
    border:1px solid var(--border2);color:var(--text2)}
  .lg .nm .sub2{display:block;font-size:11px;color:var(--text3);margin-top:1px}
  .lg .nv{flex:none;text-align:right;font-family:"DM Mono",ui-monospace,monospace}
  .lg .nv .p{font-size:16px;font-weight:500}
  .lg .nv .m{display:block;font-size:11px;color:var(--text2)}

  .note{font-size:12px;color:var(--text2);margin:0 2px 8px}
  .note.warn{color:var(--amber)}
  .empty{text-align:center;color:var(--text2);padding:36px 12px;font-size:14px}
  .empty b{color:var(--text)}

  dialog{
    border:1px solid var(--border2);border-radius:16px;background:var(--surface);color:var(--text);
    padding:0;width:min(440px,calc(100% - 24px));max-height:88vh;overflow:auto;
  }
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .dlg{padding:18px}
  .dlg h2{margin:0 0 4px;font-size:17px}
  .dlg p{margin:0 0 14px;font-size:12px;color:var(--text2)}
  .dlg label{display:block;font-size:12px;color:var(--text2);margin:10px 0 4px}
  .dlg input[type=text],.dlg input[type=password]{
    width:100%;height:44px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--bg);
    color:var(--text);padding:0 10px;font:14px "DM Mono",ui-monospace,monospace;
  }
  .dlg .act{display:flex;gap:8px;margin-top:16px}
  .btn{flex:1;height:44px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface2);font-size:14px}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  .grow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .grow span{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gh b{flex:none;width:96px;font-size:11px;font-weight:400;color:var(--text2)}
  .grow input{flex:none;width:96px;height:38px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--bg);color:var(--text);padding:0 8px;font-size:13px}
  .msg{min-height:18px;margin-top:10px;font-size:12px;color:var(--accent2)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>每日資產占比</h1>
      <p class="sub" id="sub">讀取中…</p>
    </div>
    <button class="ibtn" id="cfgBtn" aria-label="同步設定" title="同步設定">⚙</button>
  </header>

  <div class="datebar" id="datebar">
    <button class="ibtn" id="prev" aria-label="前一個記價日">‹</button>
    <div class="mid">
      <input type="date" id="dsel" aria-label="選擇日期">
      <span class="wd" id="wd"></span>
    </div>
    <button class="ibtn" id="next" aria-label="後一個記價日">›</button>
    <button class="today" id="latest">最新</button>
  </div>

  <div id="main">
    <div class="tot-row"><span class="k">股票市值</span><span class="v" id="tot">–</span><span class="d" id="totd"></span></div>
    <p class="note" id="note"></p>

    <div class="cols">
      <section class="col">
        <div class="card">
          <h3 class="ctitle">依持股</h3>
          <div class="chart-wrap"><canvas id="c" role="img" aria-label="依持股的資產配置圓餅圖"></canvas></div>
        </div>
        <div class="card"><div class="lg" id="lg"></div></div>
      </section>
      <section class="col">
        <div class="card">
          <h3 class="ctitle">依資產分類</h3>
          <div class="chart-wrap"><canvas id="c2" role="img" aria-label="依資產分類的配置圓餅圖"></canvas></div>
        </div>
        <div class="card"><div class="lg" id="lg2"></div></div>
      </section>
    </div>

    <div class="card sumcard">
      <div class="mbar" id="mbar"></div>
      <div class="mrow" id="mrow"></div>
    </div>
  </div>

  <div class="card empty" id="empty" hidden></div>
</div>

<dialog id="dlg">
  <div class="dlg">
    <h2>同步設定</h2>
    <p>這頁只讀取損益日曆的資料，不會改動它。在同一個瀏覽器開過損益日曆會自動帶入；從手機主畫面開啟時，請填一次轉接站網址與同步金鑰（與損益日曆「設定與備份」裡的相同）。</p>
    <label for="cfgUrl">資料轉接站網址</label>
    <input type="text" id="cfgUrl" placeholder="https://xxxx.workers.dev" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="cfgKey">同步金鑰</label>
    <input type="password" id="cfgKey" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label>合併與分類設定</label>
    <p style="margin:0 0 6px">同代號會自動合併。「合併成一片」：不同代號填同一個名稱就併成一片（例如兩支正2）。「資產類別」：決定它算進右邊哪一類（例如全球股票、美股、台股、債券）。留空 = 自動。</p>
    <div class="grow gh"><span></span><b>合併成一片</b><b>資產類別</b></div>
    <div id="grpList"></div>
    <div class="msg" id="cfgMsg"></div>
    <div class="act">
      <button class="btn" id="cfgClose">關閉</button>
      <button class="btn pri" id="cfgSave">儲存並同步</button>
    </div>
  </div>
</dialog>

<script>
(function(){
'use strict';

/* ---------- 小工具 ---------- */
var PNL_KEY='pnl-calendar-v1', CFG_KEY='alloc-cfg-v1', CACHE_KEY='alloc-cache-v1';
var DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
var $=function(s){return document.querySelector(s);};
var nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
var nfsh=new Intl.NumberFormat('en-US',{maximumFractionDigits:4});
var pad=function(n){return String(n).padStart(2,'0');};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var parse=function(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
var md=function(s){var d=parse(s);return (d.getMonth()+1)+'/'+d.getDate();};
var WD=['日','一','二','三','四','五','六'];
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
function rd(k){ try{ var t=localStorage.getItem(k); return t?JSON.parse(t):null; }catch(e){ return null; } }
function wr(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function timeLabel(ms){
  if(!ms) return '';
  var d=new Date(ms);
  return pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

/* ---------- 資料：與損益日曆相同的存檔格式（唯讀） ---------- */
function normalize(o,ts){
  var s={holdings:[],prices:{},fx:{},defaultFx:32,updatedAt:0,proxyUrl:'',syncKey:''};
  if(!o||typeof o!=='object') return s;
  if(Array.isArray(o.holdings)){
    s.holdings=o.holdings.filter(function(h){return h&&h.id&&h.symbol;}).map(function(h){
      return {
        id:String(h.id).replace(/[^A-Za-z0-9_-]/g,''),
        symbol:String(h.symbol), name:String(h.name||''),
        market:h.market==='US'?'US':'TW',
        lots:(Array.isArray(h.lots)?h.lots:[]).filter(function(l){return l&&DATE_RE.test(l.date)&&isFinite(l.shares);})
          .map(function(l){return {date:l.date,shares:Number(l.shares)};})
      };
    });
  }
  var ids={}; s.holdings.forEach(function(h){ids[h.id]=1;});
  if(o.prices&&typeof o.prices==='object'){
    Object.keys(o.prices).forEach(function(d){
      if(!DATE_RE.test(d)||!o.prices[d]||typeof o.prices[d]!=='object') return;
      var day={};
      Object.keys(o.prices[d]).forEach(function(k){var v=Number(o.prices[d][k]); if(ids[k]&&isFinite(v)&&v>0) day[k]=v;});
      if(Object.keys(day).length) s.prices[d]=day;
    });
  }
  if(o.fx&&typeof o.fx==='object'){
    Object.keys(o.fx).forEach(function(d){var v=Number(o.fx[d]); if(DATE_RE.test(d)&&isFinite(v)&&v>0) s.fx[d]=v;});
  }
  if(o.settings){
    var f=Number(o.settings.defaultFx); if(isFinite(f)&&f>0) s.defaultFx=f;
    if(typeof o.settings.proxyUrl==='string') s.proxyUrl=o.settings.proxyUrl.trim().replace(/\/+$/,'');
    if(typeof o.settings.syncKey==='string') s.syncKey=o.settings.syncKey.trim();
  }
  var ua=Number(ts!=null?ts:o.updatedAt); s.updatedAt=isFinite(ua)&&ua>0?ua:0;
  return s;
}

var S=null, SRC='', IDX=null, DATES=[], sel=null, charts={}, lastPull=0, pullMsg='';

function consider(raw,label,ts){
  var n=normalize(raw,ts);
  if(!n.holdings.length) return;
  if(!S||n.updatedAt>S.updatedAt){ S=n; SRC=label; }
}
function buildIndex(){
  var p={};
  S.holdings.forEach(function(h){
    var arr=[];
    Object.keys(S.prices).forEach(function(d){var v=S.prices[d][h.id]; if(typeof v==='number') arr.push([d,v]);});
    arr.sort(function(a,b){return a[0]<b[0]?-1:1;});
    p[h.id]=arr;
  });
  IDX={p:p,fx:Object.keys(S.fx).sort().map(function(d){return [d,S.fx[d]];})};
  DATES=Object.keys(S.prices).sort();
}
function atOrBefore(a,d){
  var lo=0,hi=a.length-1,r=null;
  while(lo<=hi){var m=(lo+hi)>>1; if(a[m][0]<=d){r=a[m];lo=m+1;}else hi=m-1;}
  return r;
}
function fxAt(d){ var r=atOrBefore(IDX.fx,d); return r?r[1]:S.defaultFx; }
function sharesAt(h,d){ var s=0; h.lots.forEach(function(l){ if(l.date<=d) s+=l.shares; }); return s; }

/* 某天收盤時的持股市值(台幣)。當天沒有收盤價就沿用最近一次記價,並標記出來 */
function bestPrice(h,d){
  var best=atOrBefore(IDX.p[h.id]||[],d), k=symKey(h);
  /* 同一檔股票有好幾筆持股時,只要其中一筆有較新的收盤價,大家共用最新那個 */
  S.holdings.forEach(function(o){
    if(o===h||o.market!==h.market||symKey(o)!==k) return;
    var e=atOrBefore(IDX.p[o.id]||[],d);
    if(e&&(!best||e[0]>best[0])) best=e;
  });
  return best;
}
function compute(d){
  var fx=fxAt(d), rows=[], missing=[];
  S.holdings.forEach(function(h){
    var sh=sharesAt(h,d);
    if(!(sh>0)) return;
    var pe=bestPrice(h,d);
    if(!pe){ missing.push(h); return; }
    var val=sh*pe[1]*(h.market==='US'?fx:1);
    rows.push({h:h,sh:sh,price:pe[1],pd:pe[0],val:val,carried:pe[0]!==d});
  });
  var total=rows.reduce(function(s,r){return s+r.val;},0);
  rows.forEach(function(r){ r.pct=total>0?r.val/total:0; });
  return {rows:rows,missing:missing,total:total,fx:fx};
}

/* ---------- 合併同類持股 ---------- */
var GROUPS_KEY='alloc-groups-v1';
var FAM2=['00631L','00663L','00675L','00685L'];   /* 台灣股市正2:預設歸成同一片 */
function symKey(h){ return String(h.symbol).toUpperCase().replace(/\s+/g,''); }
function defaultGroup(h){ var k=symKey(h); return (h.market==='TW'&&FAM2.indexOf(k)>=0)?'台股正2':k; }
function groupName(h){
  var ov=rd(GROUPS_KEY)||{}, o=ov[symKey(h)];
  return (typeof o==='string'&&o.trim())?o.trim():defaultGroup(h);
}
/* 同代號(例如兩筆 VT)自動合併;正2 等可在 ⚙ 裡自訂歸組 */
function groupRows(rows,total){
  var map={}, list=[];
  rows.forEach(function(x){
    var k=groupName(x.h), g=map[k];
    if(!g){ g=map[k]={key:k,members:[],val:0}; list.push(g); }
    g.members.push(x); g.val+=x.val;
  });
  list.forEach(function(g){
    var big=g.members.slice().sort(function(a,b){return b.val-a.val;})[0];
    var syms=[]; g.members.forEach(function(m){ var k=symKey(m.h); if(syms.indexOf(k)<0) syms.push(k); });
    g.sym=g.key; g.market=big.h.market;
    g.name=syms.length===1?(big.h.name||''):syms.join('＋');
    g.pct=total>0?g.val/total:0;
    var old=g.members.filter(function(m){return m.carried;});
    g.carried=old.length>0;
    g.pd=old.length?old.map(function(m){return m.pd;}).sort()[0]:'';
    g.memo=syms.map(function(s){
      var ms=g.members.filter(function(m){return symKey(m.h)===s;});
      var sh=ms.reduce(function(a,m){return a+m.sh;},0);
      return (syms.length>1?s+' ':'')+nfsh.format(sh)+' 股 × '+nfsh.format(ms[0].price)+(ms[0].h.market==='US'?' USD':'')+
        (syms.length===1&&ms.length>1?'（'+ms.length+' 筆合併）':'');
    }).join('　＋　');
  });
  return list;
}

/* ---------- 依資產分類 ---------- */
var CLASS_KEY='alloc-classes-v1';
var CLS_MAP={
  VT:'全球股票',VWRA:'全球股票',VWRL:'全球股票',VWCE:'全球股票',ACWI:'全球股票',IWDA:'全球股票',SWDA:'全球股票',
  VOO:'美股',VUAA:'美股',VUSA:'美股',VTI:'美股',SPY:'美股',IVV:'美股',SPLG:'美股',CSPX:'美股',SXR8:'美股',QQQ:'美股',
  VEA:'非美已開發',VGK:'非美已開發',EFA:'非美已開發',IEFA:'非美已開發',
  VWO:'新興市場',IEMG:'新興市場',EEM:'新興市場',
  BND:'債券',AGG:'債券',BNDW:'債券',BNDX:'債券',TLT:'債券',IEF:'債券',VGSH:'債券',VGIT:'債券',VGLT:'債券'
};
function defaultClass(h){
  var k=symKey(h);
  if(CLS_MAP[k]) return CLS_MAP[k];
  if(h.market==='TW') return /^\d{5}B$/.test(k)?'債券':'台股';
  return '海外股票';
}
function className(h){
  var ov=rd(CLASS_KEY)||{}, o=ov[symKey(h)];
  return (typeof o==='string'&&o.trim())?o.trim():defaultClass(h);
}
function classRows(rows,total){
  var map={}, list=[];
  rows.forEach(function(x){
    var k=className(x.h), g=map[k];
    if(!g){ g=map[k]={key:'cls:'+k,sym:k,name:'',market:'',val:0,bySym:{}}; list.push(g); }
    g.val+=x.val; var s=symKey(x.h); g.bySym[s]=(g.bySym[s]||0)+x.val;
  });
  list.forEach(function(g){
    g.pct=total>0?g.val/total:0; g.carried=false;
    var parts=Object.keys(g.bySym).sort(function(a,b){return g.bySym[b]-g.bySym[a];});
    g.name=parts.join('＋');
    g.memo=parts.map(function(s){return s+' '+pctTxt(total>0?g.bySym[s]/total:0);}).join('　');
  });
  return list.sort(function(a,b){return b.val-a.val;});
}

/* 每一檔一種獨立色(色票參考彩色圓環圖);同一檔每天固定同色,存在本機 */
var PALETTE=['#3b6fe0','#d6506a','#e3c94f','#7a4fe0','#3fb0d9','#e8964f','#6fc29a','#9db2ef','#c76fc4','#a3b84a'];
var COLORS_KEY='alloc-colors-v1';
function assignColors(groups){
  var m=rd(COLORS_KEY)||{}, used={}, changed=false;
  groups.forEach(function(g){ if(typeof m[g.key]==='number') used[m[g.key]%PALETTE.length]=1; });
  groups.forEach(function(g){
    if(typeof m[g.key]!=='number'){
      var i=0; while(used[i]&&i<PALETTE.length) i++;
      if(i>=PALETTE.length) i=Object.keys(m).length%PALETTE.length;
      m[g.key]=i; used[i]=1; changed=true;
    }
    g.color=PALETTE[m[g.key]%PALETTE.length];
  });
  if(changed) wr(COLORS_KEY,m);
}
function isLight(hex){
  var n=parseInt(hex.slice(1),16), r=n>>16&255, g=n>>8&255, b=n&255;
  return (0.299*r+0.587*g+0.114*b)/255>0.62;
}
var C_TW='#7d8fb3', C_US='#b79d78';   /* 台股/美股合計條用中性色,避免跟個股顏色混淆 */

function pctTxt(p){ return p>0&&p<0.001?'<0.1%':(p*100).toFixed(1)+'%'; }

/* 在每片扇形上標持股代號:夠大的標在片內(代號+占比),太小的拉線標在圓外 */
function sliceLabels(items,total){
  var FONT='"Noto Sans TC","DM Sans",-apple-system,"PingFang TC",sans-serif';
  return {
    id:'sliceLabels',
    afterDatasetsDraw:function(ch){
      var ctx=ch.ctx, arcs=ch.getDatasetMeta(0).data, outs=[];
      ctx.save(); ctx.textBaseline='middle';
      arcs.forEach(function(arc,i){
        var it=items[i], frac=it.v/total; if(!(frac>0)) return;
        var g=arc.getProps(['x','y','startAngle','endAngle','outerRadius'],true);
        var mid=(g.startAngle+g.endAngle)/2, cs=Math.cos(mid), sn=Math.sin(mid);
        var rr=g.outerRadius*(frac>=0.25?0.62:0.68), fits=false;
        if(frac>=0.09){
          ctx.font='700 12px '+FONT;
          var chord=2*rr*Math.sin(Math.min(Math.PI/2,Math.PI*frac));
          fits=ctx.measureText(it.sym).width+8<chord && frac>=0.09;
        }
        if(fits){
          var x=g.x+cs*rr, y=g.y+sn*rr;
          ctx.textAlign='center'; ctx.fillStyle=it.dark?'#14141a':'#ffffff';
          ctx.font='700 12px '+FONT; ctx.fillText(it.sym,x,y-7);
          ctx.font='500 11px '+FONT; ctx.fillText(pctTxt(frac),x,y+8);
        } else {
          outs.push({it:it,frac:frac,g:g,cs:cs,sn:sn});
        }
      });
      /* 圓外標籤:左右各自排開,避免互相蓋住 */
      [1,-1].forEach(function(side){
        var list=outs.filter(function(o){return (o.cs>=0?1:-1)===side;}).sort(function(a,b){return a.sn-b.sn;});
        var minGap=28, ys=[], top=16, bot=ch.height-16;
        list.forEach(function(o,k){
          var y=o.g.y+o.sn*(o.g.outerRadius+14);
          ys.push(Math.min(bot,Math.max(top,y)));
        });
        for(var k=1;k<ys.length;k++){ if(ys[k]<ys[k-1]+minGap) ys[k]=ys[k-1]+minGap; }          /* 由上往下推開 */
        for(var k2=ys.length-1;k2>=0;k2--){                                                   /* 超出下緣就由下往上收回 */
          var lim=k2===ys.length-1?bot:ys[k2+1]-minGap;
          if(ys[k2]>lim) ys[k2]=lim;
        }
        list.forEach(function(o,k){
          var R=o.g.outerRadius, x0=o.g.x+o.cs*R, y0=o.g.y+o.sn*R;
          var x1=o.g.x+o.cs*(R+10), y1=o.g.y+o.sn*(R+10);
          var x2=o.g.x+side*(R+14), y2=ys[k];
          ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
          ctx.textAlign=side>0?'left':'right'; ctx.fillStyle='#f0f0f2';
          ctx.font='700 11px '+FONT; ctx.fillText(o.it.sym,x2+side*4,y2-7);
          ctx.font='500 11px '+FONT; ctx.fillStyle='#b4b4c4'; ctx.fillText(pctTxt(o.frac),x2+side*4,y2+7);
        });
      });
      ctx.restore();
    }
  };
}

/* ---------- 畫面 ---------- */
function showEmpty(html){
  $('#main').hidden=true; $('#datebar').hidden=true;
  var e=$('#empty'); e.hidden=false; e.innerHTML=html;
}
function render(){
  if(!S||!DATES.length){
    showEmpty('<b>還沒有可用的資料</b><br>請先在損益日曆記錄持股與收盤價。<br>若是從手機主畫面開啟，請點右上角 ⚙ 填入轉接站網址與同步金鑰。');
    $('#sub').textContent=pullMsg||'尚無資料';
    return;
  }
  $('#main').hidden=false; $('#datebar').hidden=false; $('#empty').hidden=true;

  var first=DATES[0], last=DATES[DATES.length-1];
  if(!sel||sel<first) sel=last;
  if(sel>last) sel=last;

  var di=$('#dsel'); di.min=first; di.max=last; di.value=sel;
  $('#wd').textContent='週'+WD[parse(sel).getDay()]+(sel===last?'・最新記價日':'');
  var pi=-1,ni=-1;
  DATES.forEach(function(x,i){ if(x<sel) pi=i; if(x>sel&&ni<0) ni=i; });
  $('#prev').disabled=pi<0; $('#next').disabled=ni<0; $('#latest').disabled=(sel===last);

  var r=compute(sel);
  var gs=groupRows(r.rows,r.total);
  var tw=gs.filter(function(x){return x.market==='TW';}).sort(function(a,b){return b.val-a.val;});
  var us=gs.filter(function(x){return x.market==='US';}).sort(function(a,b){return b.val-a.val;});
  var ordered=tw.concat(us);
  assignColors(ordered);
  var twT=tw.reduce(function(s,x){return s+x.val;},0), usT=us.reduce(function(s,x){return s+x.val;},0);

  $('#sub').textContent='資料：'+SRC+' ・更新於 '+timeLabel(S.updatedAt)+(pullMsg?' ・'+pullMsg:'');
  $('#tot').textContent=r.total>0?'NT$ '+nf0.format(r.total):'–';
  $('#totd').textContent=md(sel);

  /* 兩張圓餅圖:依持股、依資產分類,名稱直接標在圖上 */
  var items=ordered.map(function(x){
    return {sym:x.sym,name:x.sym+(x.name?' '+x.name:''),v:x.val,c:x.color,dark:isLight(x.color)};
  });
  drawPie('#c','h',items,r.total);
  var cls=classRows(r.rows,r.total);
  assignColors(cls);
  drawPie('#c2','c',cls.map(function(x){
    return {sym:x.sym,name:x.sym+(x.name?' '+x.name:''),v:x.val,c:x.color,dark:isLight(x.color)};
  }),r.total);

  /* 台/美股合計列 */
  $('#mbar').innerHTML=
    (twT>0?'<i style="width:'+(twT/r.total*100)+'%;background:'+C_TW+'"></i>':'')+
    (usT>0?'<i style="width:'+(usT/r.total*100)+'%;background:'+C_US+'"></i>':'');
  $('#mrow').innerHTML=
    '<span><span class="sw" style="background:'+C_TW+'"></span>台股 <b>'+pctTxt(r.total>0?twT/r.total:0)+'</b></span>'+
    '<span><span class="sw" style="background:'+C_US+'"></span>海外 <b>'+pctTxt(r.total>0?usT/r.total:0)+'</b></span>'+
    '<span>匯率 <b>'+nfsh.format(r.fx)+'</b></span>';

  /* 提醒 */
  var notes=[], carried=ordered.filter(function(x){return x.carried;});
  if(carried.length) notes.push(carried.map(function(x){return x.sym;}).join('、')+' 當天沒有收盤價，沿用前一次記價（標示「沿用」）。');
  if(r.missing.length) notes.push(r.missing.map(function(h){return h.symbol;}).join('、')+' 到這天為止還沒有任何收盤價，未計入。');
  if(!r.rows.length) notes.push('這天沒有持股，請換一天。');
  var ne=$('#note'); ne.textContent=notes.join(' '); ne.className='note'+(notes.length?' warn':''); ne.hidden=!notes.length;

  /* 明細 */
  $('#lg').innerHTML=legendHtml(ordered,true);
  $('#lg2').innerHTML=legendHtml(cls,false);
}
function legendHtml(list,showMarket){
  return list.map(function(x){
    return '<div class="row">'+
      '<span class="dot" style="background:'+x.color+'"></span>'+
      '<div class="nm"><b>'+esc(x.sym)+'</b>'+(x.name?'<small>'+esc(x.name)+'</small>':'')+
        (showMarket?'<span class="tag">'+(x.market==='TW'?'台':'海外')+'</span>':'')+
        (x.carried?'<span class="tag">沿用 '+md(x.pd)+'</span>':'')+
        '<span class="sub2">'+esc(x.memo)+'</span></div>'+
      '<div class="nv"><span class="p">'+pctTxt(x.pct)+'</span><span class="m">NT$ '+nf0.format(x.val)+'</span></div>'+
    '</div>';
  }).join('');
}
function drawPie(id,slot,items,total){
  var sidePad=items.some(function(i){return i.v/total<0.14;})?64:14;
  if(charts[slot]){ charts[slot].destroy(); charts[slot]=null; }
  if(!(window.Chart&&total>0)) return;
  charts[slot]=new Chart($(id).getContext('2d'),{
    type:'pie',
    data:{
      labels:items.map(function(i){return i.name;}),
      datasets:[{data:items.map(function(i){return Math.round(i.v);}),backgroundColor:items.map(function(i){return i.c;}),borderWidth:2,borderColor:'#18181c'}]
    },
    options:{
      responsive:true,maintainAspectRatio:false,animation:{duration:250},
      layout:{padding:{left:sidePad,right:sidePad,top:14,bottom:14}},
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{
          title:function(){return '';},
          label:function(ctx){
            var it=items[ctx.dataIndex];
            return it.name+'  '+pctTxt(it.v/total)+'  NT$ '+nf0.format(it.v);
          }
        }}
      }
    },
    plugins:[sliceLabels(items,total)]
  });
}

/* ---------- 雲端同步（只讀） ---------- */
function cfg(){
  var c=rd(CFG_KEY)||{}, l=S?{proxyUrl:S.proxyUrl,syncKey:S.syncKey}:{};
  var loc=normalize(rd(PNL_KEY));
  return {
    proxyUrl:String(c.proxyUrl||loc.proxyUrl||l.proxyUrl||'').trim().replace(/\/+$/,''),
    syncKey:String(c.syncKey||loc.syncKey||l.syncKey||'').trim()
  };
}
function pull(manual){
  var c=cfg();
  if(!c.proxyUrl||!c.syncKey){ pullMsg=manual?'請先填轉接站網址與同步金鑰':''; render(); return Promise.resolve(); }
  pullMsg='同步中…'; render();
  return fetch(c.proxyUrl+'/sync',{headers:{'X-Sync-Key':c.syncKey}})
    .then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); })
    .then(function(j){
      lastPull=Date.now();
      if(!j||!j.data){ pullMsg='雲端尚無資料'; return; }
      wr(CACHE_KEY,{data:j.data,updatedAt:j.updatedAt});
      consider(j.data,'雲端',j.updatedAt);
      pullMsg='已檢查雲端 '+timeLabel(Date.now());
    })
    .catch(function(){ pullMsg='雲端讀取失敗，顯示的是上次的資料'; })
    .then(function(){ if(S) buildIndex(); render(); });
}

/* ---------- 事件 ---------- */
function step(dir){
  var t=null;
  if(dir<0){ DATES.forEach(function(x){ if(x<sel) t=x; }); }
  else { for(var i=0;i<DATES.length;i++){ if(DATES[i]>sel){ t=DATES[i]; break; } } }
  if(t){ sel=t; render(); }
}
$('#prev').addEventListener('click',function(){ step(-1); });
$('#next').addEventListener('click',function(){ step(1); });
$('#latest').addEventListener('click',function(){ if(DATES.length){ sel=DATES[DATES.length-1]; render(); } });
$('#dsel').addEventListener('change',function(e){ if(DATE_RE.test(e.target.value)){ sel=e.target.value; render(); } });

var dlg=$('#dlg');
function openDlg(){
  var c=cfg(); $('#cfgUrl').value=c.proxyUrl; $('#cfgKey').value=c.syncKey; $('#cfgMsg').textContent='';
  var ov=rd(GROUPS_KEY)||{}, cv=rd(CLASS_KEY)||{}, seen={}, html='';
  (S?S.holdings:[]).forEach(function(h){
    var k=symKey(h); if(seen[k]) return; seen[k]=1;
    html+='<div class="grow"><span>'+esc(h.symbol)+(h.name?' '+esc(h.name):'')+'</span>'+
      '<input type="text" data-kind="g" data-sym="'+esc(k)+'" value="'+esc(ov[k]||'')+'" placeholder="'+esc(defaultGroup(h))+'" maxlength="12">'+
      '<input type="text" data-kind="c" data-sym="'+esc(k)+'" value="'+esc(cv[k]||'')+'" placeholder="'+esc(defaultClass(h))+'" maxlength="12"></div>';
  });
  $('#grpList').innerHTML=html;
  if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
}
function closeDlg(){ if(dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
$('#cfgBtn').addEventListener('click',openDlg);
$('#cfgClose').addEventListener('click',closeDlg);
$('#cfgSave').addEventListener('click',function(){
  wr(CFG_KEY,{proxyUrl:$('#cfgUrl').value.trim().replace(/\/+$/,''),syncKey:$('#cfgKey').value.trim()});
  var gn={}, cn={};
  document.querySelectorAll('#grpList input').forEach(function(i){ var v=i.value.trim(); if(v) (i.getAttribute('data-kind')==='c'?cn:gn)[i.getAttribute('data-sym')]=v; });
  wr(GROUPS_KEY,gn); wr(CLASS_KEY,cn); if(S) render();
  $('#cfgMsg').textContent='已儲存，同步中…';
  pull(true).then(function(){ $('#cfgMsg').textContent=pullMsg; if(S) closeDlg(); });
});

document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible' && Date.now()-lastPull>5*60*1000) pull(false);
});

/* ---------- 啟動 ---------- */
consider(rd(PNL_KEY),'本機');
var cache=rd(CACHE_KEY); if(cache&&cache.data) consider(cache.data,'雲端快取',cache.updatedAt);
if(S) buildIndex();
render();
pull(false);
})();
</script>
</body>
</html>
